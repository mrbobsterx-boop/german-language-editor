<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>German Language Editor</title>
<style>
:root{
  --bg:#242424;--panel:#292929;--line:#474747;--text:#d7d7d7;
  --muted:#9d9d9d;--heading:#b9c9d8;--accent2:#6f96b4;
  --popup:#202020;--green:#8db69b;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:64px;padding:0 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#222}
.brand{font-size:19px;font-weight:700;color:var(--heading)}
.toolbar{display:flex;gap:8px;align-items:center}
.btn{border:1px solid #505050;background:#303030;color:#d5d5d5;border-radius:6px;padding:8px 12px}
.btn:hover{background:#3a3a3a;border-color:#666}
.btn.primary{background:#3c566b;border-color:#55748d;color:#eef6fb}
.toggle{display:flex;align-items:center;gap:7px;margin-left:8px;color:#bbb;font-size:13px;user-select:none}
.workspace{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.workspace.single{grid-template-columns:1fr}
.column{min-width:0;display:flex;flex-direction:column}
.column+.column{border-left:1px solid var(--line)}
.column-header{height:48px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);color:var(--heading);font-weight:700;background:#272727}
.column-header small{color:var(--muted);font-weight:400;font-size:12px}
.editor-wrap{position:relative;flex:1;overflow:auto}
.editor{width:100%;min-height:100%;padding:28px 32px 120px;outline:none;white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:1.72;color:#d9d9d9}
.editor:empty:before{content:attr(data-placeholder);color:#777}
.dictionary-list{padding:18px 22px 90px;overflow:auto;min-height:100%}
.dictionary-empty{color:#777;font-size:14px;line-height:1.6;padding:12px 2px}
.dictionary-item{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:13px 2px;border-bottom:1px solid #2b2b2b}
.dictionary-word{color:#e6e6e6;font-size:16px;font-weight:600;line-height:1.35}
.dictionary-form{color:#808080;font-size:12px;margin-top:4px}
.dictionary-translation{color:#c9c9c9;font-size:15px;line-height:1.4;text-align:right;max-width:52%}
.dictionary-status{padding:8px 22px;color:#888;font-size:11px;border-bottom:1px solid #2b2b2b}
.annotation{display:inline;background:rgba(143,179,207,.13);border-bottom:1px solid #6f96b4;border-radius:2px;padding:1px 2px}
.active-word{background:rgba(73,120,160,.42);border-radius:3px;padding:1px 2px;box-shadow:0 0 0 1px rgba(111,150,180,.35)}
.hover-word{background:rgba(73,120,160,.20);border-radius:3px;padding:1px 2px;box-shadow:0 0 0 1px rgba(111,150,180,.20)}
.missing-word{border-bottom:2px dotted #d98b8b;cursor:pointer}
.missing-word:hover{background:rgba(217,139,139,.10)}
.dictionary-item{position:relative}
.dictionary-delete{flex:0 0 auto;border:1px solid #4b4b4b;background:#2b2b2b;color:#aaa;border-radius:5px;padding:5px 8px;font-size:11px}
.dictionary-delete:hover{background:#3a3a3a;color:#ddd}
.annotation-note{color:#9eb9cc;font-size:.78em;margin-left:3px;opacity:.95}
.selection-popup{position:fixed;z-index:1000;width:330px;background:var(--popup);border:1px solid #555;border-radius:8px;box-shadow:0 15px 45px rgba(0,0,0,.45);padding:14px;display:none}
.selection-popup.visible{display:block}
.popup-word{font-size:19px;font-weight:700;color:#e1e8ed;margin-bottom:3px}
.popup-form{color:#91adc1;font-size:14px;margin-bottom:10px}
.popup-row{display:grid;grid-template-columns:92px 1fr;gap:8px;margin:5px 0;font-size:14px}
.popup-label{color:#858585}.popup-value{color:#ddd}
.popup-actions{display:flex;gap:7px;margin-top:13px}
.popup-actions .btn{flex:1;font-size:12px;padding:7px 8px}
.popup-input{width:100%;margin-top:10px;background:#2c2c2c;color:#ddd;border:1px solid #4c4c4c;border-radius:5px;padding:8px 9px;outline:none}
.popup-input:focus{border-color:var(--accent2)}
.statusbar{height:34px;border-top:1px solid var(--line);padding:0 16px;display:flex;align-items:center;justify-content:space-between;color:#858585;font-size:12px;background:#222}
.statusbar .saved{color:var(--green)}
#fileInput{display:none}
@media(max-width:800px){
  .workspace{grid-template-columns:1fr}.translation-column{display:none}
  .topbar{padding:0 12px}.editor{padding:22px 18px 100px}
}
</style>
</head>
<body data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false">
<div class="app">
<header class="topbar">
  <div class="brand">German Language Editor</div>
  <div class="toolbar">
    <button class="btn" id="newBtn">Новый</button>
    <button class="btn" id="openBtn">Открыть</button>
    <button class="btn primary" id="saveBtn">Сохранить</button>
    <button class="btn" id="memoryBtn">Подключить память</button>
    <label class="toggle">
      <input type="checkbox" id="dictionaryToggle" checked>
      Слова для обучения
    </label>
  </div>
</header>

<main class="workspace" id="workspace">
<section class="column">
  <div class="column-header">
  <span>Deutsch</span>
  <small id="editorStats">Оригинал · 0 слов · найдено: 0 · не найдено: 0</small>
</div>
  <div class="editor-wrap">
    <div id="editor" class="editor" contenteditable="true" spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" autocorrect="off" autocapitalize="off"
         data-placeholder="Вставь сюда немецкий текст..."></div>
  </div>
</section>

<section class="column translation-column" id="translationColumn">
  <div class="column-header"><span>Слова</span><small>Память для обучения</small></div>
  <div id="dictionaryStatus" class="dictionary-status">Загрузка словаря...</div>
  <div id="dictionaryList" class="dictionary-list">
    <div class="dictionary-empty">Сохранённые слова появятся здесь.</div>
  </div>
</section>
</main>

<footer class="statusbar">
  <span id="status">Загрузка словаря...</span>
  <span id="wordCount">0 слов</span>
</footer>
</div>

<input type="file" id="fileInput" accept=".json,.txt">
<input type="file" id="memoryInput" accept=".json" style="display:none">

<div class="selection-popup" id="popup">
  <div class="popup-word" id="popupWord">Wort</div>
  <div class="popup-form" id="popupForm">—</div>

  <div class="popup-row">
    <div class="popup-label">Перевод</div>
    <div class="popup-value" id="popupTranslation">—</div>
  </div>

  <div class="popup-row">
    <div class="popup-label">Базовая форма</div>
    <div class="popup-value" id="popupBase">—</div>
  </div>

  <div class="popup-row">
    <div class="popup-label">Артикль</div>
    <div class="popup-value" id="popupArticle">—</div>
  </div>

  <input id="annotationInput" class="popup-input"
         placeholder="Перевод для пометки в тексте...">

  <div class="popup-actions">
    <button class="btn" id="annotateBtn">Добавить в текст</button>
    <button class="btn primary" id="dictionaryBtn">Сохранить в словарь</button>
  </div>
</div>

<script>
/*
  German Language Editor
  ======================
  Dictionary source:
      data/de-ru-freedict.json

  Expected JSON:
  [
    {"word":"machen","translation":["делать"],"grammar":"verb"},
    ...
  ]

  Also accepts an object with a "words" array.
*/

/* ---------- state ---------- */

const editor = document.getElementById("editor");
const popup = document.getElementById("popup");
const dictionaryList = document.getElementById("dictionaryList");
const dictionaryStatus = document.getElementById("dictionaryStatus");
const statusEl = document.getElementById("status");
const wordCountEl = document.getElementById("wordCount");
const editorStatsEl = document.getElementById("editorStats");
const workspace = document.getElementById("workspace");
const fileInput = document.getElementById("fileInput");

let localDictionary = new Map();
let learningDictionary = new Map();
let savedWords = [];
const LEARNING_MEMORY_KEY = "german-language-learning-memory-v2";
const MEMORY_HANDLE_DB = "german-language-editor-memory-db";
const MEMORY_HANDLE_STORE = "handles";
const MEMORY_HANDLE_KEY = "learning-memory-file";
let learningMemoryHandle = null;
let memoryFileName = "learning-words.json";
let currentSelection = null;
let selectionJustFinished = false;
let pinnedPopup = false;

/* ---------- learning memory ---------- */

function loadLearningMemory(){
  try{
    const raw = localStorage.getItem(LEARNING_MEMORY_KEY);
    const data = raw ? JSON.parse(raw) : [];
    savedWords = Array.isArray(data) ? data.filter(Boolean) : [];
  }catch(error){
    console.error(error);
    savedWords = [];
  }
  renderDictionary();
}

function saveLearningMemoryLocal(){
  try{
    localStorage.setItem(LEARNING_MEMORY_KEY, JSON.stringify(savedWords));
    return true;
  }catch(error){
    console.error(error);
    statusEl.textContent = "Не удалось сохранить память слов в браузере";
    return false;
  }
}

function memoryFilePayload(){
  return {
    version: 1,
    type: "german-language-learning-memory",
    savedAt: new Date().toISOString(),
    words: savedWords
  };
}

async function saveLearningMemoryFile(){
  if(!learningMemoryHandle) return false;

  try{
    let permission = "granted";
    if(learningMemoryHandle.queryPermission){
      permission = await learningMemoryHandle.queryPermission({mode:"readwrite"});
    }
    if(permission !== "granted" && learningMemoryHandle.requestPermission){
      permission = await learningMemoryHandle.requestPermission({mode:"readwrite"});
    }
    if(permission !== "granted") return false;

    const writable = await learningMemoryHandle.createWritable();
    await writable.write(JSON.stringify(memoryFilePayload(), null, 2));
    await writable.close();
    return true;
  }catch(error){
    console.error(error);
    return false;
  }
}

async function saveLearningMemory(){
  const localOk = saveLearningMemoryLocal();
  const fileOk = await saveLearningMemoryFile();

  if(fileOk){
    statusEl.textContent = "Слово сохранено в памяти и в файле " + memoryFileName;
  }else if(localOk){
    statusEl.textContent = learningMemoryHandle
      ? "Слово сохранено в памяти браузера; файл памяти недоступен"
      : "Слово сохранено в памяти браузера";
  }
}

function openMemoryDb(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB недоступна")); return; }
    const request = indexedDB.open(MEMORY_HANDLE_DB, 1);
    request.onupgradeneeded = () => {
      if(!request.result.objectStoreNames.contains(MEMORY_HANDLE_STORE)){
        request.result.createObjectStore(MEMORY_HANDLE_STORE);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function saveMemoryHandle(handle){
  try{
    const db = await openMemoryDb();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(MEMORY_HANDLE_STORE, "readwrite");
      tx.objectStore(MEMORY_HANDLE_STORE).put(handle, MEMORY_HANDLE_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  }catch(error){
    console.error(error);
  }
}

async function loadMemoryHandle(){
  try{
    const db = await openMemoryDb();
    const handle = await new Promise((resolve,reject)=>{
      const tx = db.transaction(MEMORY_HANDLE_STORE, "readonly");
      const request = tx.objectStore(MEMORY_HANDLE_STORE).get(MEMORY_HANDLE_KEY);
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
    });
    db.close();
    if(handle){
      learningMemoryHandle = handle;
      memoryFileName = handle.name || memoryFileName;
      document.getElementById("memoryBtn").textContent = "Память: " + memoryFileName;
    }
  }catch(error){
    console.error(error);
  }
}

async function connectMemoryFile(){
  try{
    if(!window.showSaveFilePicker){
      // Universal fallback: import/export still works, while localStorage
      // keeps this browser's memory after reload.
      memoryInput.click();
      return;
    }

    const handle = await window.showSaveFilePicker({
      suggestedName: "learning-words.json",
      types: [{
        description: "Файл памяти слов",
        accept: {"application/json": [".json"]}
      }]
    });

    learningMemoryHandle = handle;
    memoryFileName = handle.name || "learning-words.json";
    await saveMemoryHandle(handle);
    await saveLearningMemoryFile();
    document.getElementById("memoryBtn").textContent = "Память: " + memoryFileName;
    statusEl.textContent = "Файл памяти подключён: " + memoryFileName;
  }catch(error){
    if(error && error.name === "AbortError") return;
    console.error(error);
    statusEl.textContent = "Не удалось подключить файл памяти";
  }
}

async function importMemoryFile(file){
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    const words = Array.isArray(data) ? data : data.words;
    if(!Array.isArray(words)) throw new Error("Неверный формат файла памяти");

    savedWords = words.filter(item => item && item.word && item.translation);
    injectLearningWordsIntoDictionary();
    saveLearningMemoryLocal();
    renderDictionary();
    refreshMissingWordMarks();
    updateWordCount();
    statusEl.textContent = "Память слов загружена из файла";
  }catch(error){
    console.error(error);
    statusEl.textContent = "Ошибка открытия файла памяти";
  }
}

function addToLearningMemory(item){
  const key = normalizeWord(item.word);
  const index = savedWords.findIndex(x => normalizeWord(x.word) === key);
  if(index >= 0){
    savedWords[index] = {...savedWords[index], ...item};
  }else{
    savedWords.push(item);
  }
  saveLearningMemory();
  renderDictionary();
}

function removeFromLearningMemory(index){
  if(index < 0 || index >= savedWords.length) return;
  const removed = savedWords[index];
  savedWords.splice(index, 1);

  // Remove only the personal learning entry. The original FreeDict entry,
  // if it exists, remains available.
  const key = normalizeWord(removed.word);
  learningDictionary.delete(key);

  saveLearningMemory();
  renderDictionary();
  updateWordCount();
  refreshMissingWordMarks();
  statusEl.textContent = "Слово удалено из памяти";
}

function mergeDocumentWords(words){
  if(!Array.isArray(words)) return;
  let changed = false;
  for(const item of words){
    if(!item || !item.word || !item.translation) continue;
    const key = normalizeWord(item.word);
    const existing = savedWords.find(x => normalizeWord(x.word) === key);
    if(existing){
      if(item.translation && existing.translation !== item.translation){
        Object.assign(existing, item);
        changed = true;
      }
    }else{
      savedWords.push(item);
      changed = true;
    }
  }
  if(changed) saveLearningMemory();
}

function injectLearningWordsIntoDictionary(){
  learningDictionary.clear();
  for(const item of savedWords){
    if(!item || !item.word || !item.translation) continue;
    const key = normalizeWord(item.word);
    learningDictionary.set(key, {
      word: item.base || item.word,
      translation: item.translation,
      grammar: item.grammar || ""
    });
  }
}

/* ---------- dictionary ---------- */

function normalizeWord(value){
  return String(value || "")
    .trim()
    .toLocaleLowerCase("de-DE")
    .replace(/^[„“"«»'‘’([{]+/u, "")
    .replace(/[.,!?;:…„“"«»)\]}]+$/u, "");
}

function normalizeTranslation(value){
  if(Array.isArray(value)) return value.filter(Boolean).join("; ");
  return String(value || "").trim();
}

function addDictionaryEntry(entry){
  if(!entry || typeof entry !== "object") return;

  const word = String(
    entry.word ??
    entry.headword ??
    entry.de ??
    entry.german ??
    ""
  ).trim();

  const translation = normalizeTranslation(
    entry.translation ??
    entry.translations ??
    entry.ru ??
    entry.russian ??
    ""
  );

  if(!word || !translation) return;

  const key = normalizeWord(word);
  if(!key) return;

  if(!localDictionary.has(key)){
    localDictionary.set(key, {
      word,
      translation,
      grammar: String(entry.grammar ?? entry.pos ?? "").trim()
    });
  }
}

async function loadLocalDictionary(){
  try{
    const response = await fetch("data/de-ru-freedict.json", {
      cache: "no-store"
    });

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if(Array.isArray(data)){
      for(const entry of data) addDictionaryEntry(entry);
    }else if(data && Array.isArray(data.words)){
      for(const entry of data.words) addDictionaryEntry(entry);
    }else if(data && Array.isArray(data.entries)){
      /*
        This is the actual format of our converted FreeDict file:
        {
          "source": "...",
          "version": "...",
          "wordcount": 26809,
          "entries": [
            {
              "word": "machen",
              "translation": ["делать"],
              "grammar": "verb"
            }
          ]
        }
      */
      for(const entry of data.entries) addDictionaryEntry(entry);
    }else if(data && typeof data === "object"){
      /*
        Supports a compact object dictionary too.
      */
      for(const [word, value] of Object.entries(data)){
        if(["source","version","wordcount","entries","words"].includes(word)) continue;

        if(value && typeof value === "object" && !Array.isArray(value)){
          addDictionaryEntry({word, ...value});
        }else{
          addDictionaryEntry({word, translation:value});
        }
      }
    }

    dictionaryStatus.textContent =
      "FreeDict DE→RU: " +
      localDictionary.size.toLocaleString("ru-RU") +
      " записей";

    statusEl.textContent = "Словарь загружен";
  }catch(error){
    console.error(error);

    dictionaryStatus.textContent =
      "Не удалось загрузить data/de-ru-freedict.json";

    statusEl.textContent = "Ошибка загрузки словаря";
  }
}

function uniqueStrings(items){
  return [...new Set(items.filter(Boolean))];
}

function preserveCase(original, candidate){
  if(!candidate) return candidate;
  if(original[0] && original[0] === original[0].toUpperCase()){
    return candidate.charAt(0).toUpperCase() + candidate.slice(1);
  }
  return candidate;
}

/*
  German morphology layer.
  We do NOT guess a lemma blindly: every generated candidate is checked
  against FreeDict. This keeps the fallback conservative.
*/
const irregularGermanForms = {
  bin:"sein", bist:"sein", ist:"sein", sind:"sein", seid:"sein",
  war:"sein", warst:"sein", waren:"sein", gewesen:"sein",
  habe:"haben", hast:"haben", hat:"haben", hatte:"haben", hatten:"haben", gehabt:"haben",
  werde:"werden", wirst:"werden", wird:"werden", wurde:"werden", wurden:"werden", geworden:"werden",
  kann:"können", kannst:"können", konnte:"können", konnten:"können", gekonnt:"können",
  muss:"müssen", musst:"müssen", musste:"müssen", mussten:"müssen", gemusst:"müssen",
  darf:"dürfen", darfst:"dürfen", durfte:"dürfen", durften:"dürfen", gedurft:"dürfen",
  soll:"sollen", sollst:"sollen", sollte:"sollen", sollten:"sollen", gesollt:"sollen",
  will:"wollen", willst:"wollen", wollte:"wollen", wollten:"wollen", gewollt:"wollen",
  mag:"mögen", magst:"mögen", mochte:"mögen", mochten:"mögen", gemocht:"mögen",
  ging:"gehen", gingen:"gehen", gegangen:"gehen",
  kam:"kommen", kamen:"kommen", gekommen:"kommen",
  sah:"sehen", siehst:"sehen", sieht:"sehen", sahen:"sehen", gesehen:"sehen",
  zog:"ziehen", zogen:"ziehen", gezogen:"ziehen",
  tat:"tun", tust:"tun", tut:"tun", taten:"tun", getan:"tun",
  weiß:"wissen", weißt:"wissen", wusste:"wissen", wussten:"wissen", gewusst:"wissen",
  brachte:"bringen", brachten:"bringen", gebracht:"bringen",
  dachte:"denken", dachten:"denken", gedacht:"denken",
  nahm:"nehmen", nimmst:"nehmen", nimmt:"nehmen", nahmen:"nehmen", genommen:"nehmen",
  sprach:"sprechen", sprichst:"sprechen", spricht:"sprechen", sprachen:"sprechen", gesprochen:"sprechen",
  gab:"geben", gibst:"geben", gibt:"geben", gaben:"geben", gegeben:"geben",
  aß:"essen", isst:"essen", aßen:"essen", gegessen:"essen",
  las:"lesen", liest:"lesen", lasen:"lesen", gelesen:"lesen",
  schrieb:"schreiben", schrieben:"schreiben", geschrieben:"schreiben",
  blieb:"bleiben", blieben:"bleiben", geblieben:"bleiben",
  ließ:"lassen", lässt:"lassen", ließen:"lassen", gelassen:"lassen",
  fiel:"fallen", fällst:"fallen", fällt:"fallen", fielen:"fallen", gefallen:"fallen",
  hielt:"halten", hältst:"halten", hält:"halten", hielten:"halten", gehalten:"halten",
  stand:"stehen", standen:"stehen", gestanden:"stehen",
  fand:"finden", fanden:"finden", gefunden:"finden",
  verlor:"verlieren", verloren:"verlieren",
  bot:"bieten", boten:"bieten", geboten:"bieten",
  bat:"bitten", baten:"bitten", gebeten:"bitten",
  flog:"fliegen", flogen:"fliegen", geflogen:"fliegen",
  half:"helfen", hilfst:"helfen", hilft:"helfen", halfen:"helfen", geholfen:"helfen",
  lief:"laufen", läufst:"laufen", läuft:"laufen", liefen:"laufen", gelaufen:"laufen",
  lag:"liegen", lagen:"liegen", gelegen:"liegen",
  rief:"rufen", riefen:"rufen", gerufen:"rufen",
  schlug:"schlagen", schlägst:"schlagen", schlägt:"schlagen", schlugen:"schlagen", geschlagen:"schlagen",
  trug:"tragen", trägst:"tragen", trägt:"tragen", trugen:"tragen", getragen:"tragen",
  traf:"treffen", triffst:"treffen", trifft:"treffen", trafen:"treffen", getroffen:"treffen",
  trank:"trinken", tranken:"trinken", getrunken:"trinken",
  wusch:"waschen", wäschst:"waschen", wäscht:"waschen", wuschen:"waschen", gewaschen:"waschen"
};

function umlautBack(word){
  const variants = [word];
  if(word.includes("ä")) variants.push(word.replace(/ä/g,"a"));
  if(word.includes("ö")) variants.push(word.replace(/ö/g,"o"));
  if(word.includes("ü")) variants.push(word.replace(/ü/g,"u"));
  if(word.includes("äu")) variants.push(word.replace(/äu/g,"au"));
  return uniqueStrings(variants);
}

function morphologyCandidates(word){
  const w = normalizeWord(word).toLowerCase();
  if(!w) return [];

  const out = [];
  const add = v => { if(v && v !== w) out.push(v); };

  // Known irregular forms first.
  if(irregularGermanForms[w]) add(irregularGermanForms[w]);

  // Separable-prefix infinitives with "zu":
  // vorbeizukommen -> vorbeikommen -> kommen
  // aufzustehen -> aufstehen -> stehen
  // mitzunehmen -> mitnehmen -> nehmen
  // We generate both the complete verb and its core verb; every candidate
  // is checked against FreeDict before it is accepted.
  const separablePrefixes = [
    "ab", "an", "auf", "aus", "ein", "fest", "fort", "heim", "her",
    "hin", "los", "mit", "nach", "vor", "weg", "weiter", "wieder",
    "zu", "zurück", "zusammen", "vorbei", "herein", "heraus", "hinein",
    "hinaus", "hinauf", "hinab", "entgegen", "empor"
  ];
  if(w.includes("zu")){
    for(const prefix of separablePrefixes){
      const marker = prefix + "zu";
      if(w.startsWith(marker) && w.length > marker.length + 2){
        const core = w.slice(marker.length);
        // Infinitive: ...zukommen -> ...kommen
        add(prefix + core);
        add(core);
      }
    }
  }

  // Participles and common verb endings.
  if(w.startsWith("ge") && w.length > 5){
    add(w.replace(/^ge/, "").replace(/t$/,"en"));
    add(w.replace(/^ge/, "").replace(/en$/,""));
    add(w.replace(/^ge/, "").replace(/t$/,""));
  }
  if(/(st|t|en|te|ten|test|tet)$/.test(w)){
    if(w.endsWith("st")) add(w.slice(0,-2)+"en");
    if(w.endsWith("t")) add(w.slice(0,-1)+"en");
    if(w.endsWith("te")) add(w.slice(0,-2)+"en");
    if(w.endsWith("ten")) add(w.slice(0,-3)+"en");
    if(w.endsWith("test")) add(w.slice(0,-4)+"en");
    if(w.endsWith("tet")) add(w.slice(0,-3)+"en");
  }

  // Noun/adjective inflections. Generate multiple candidates and let the
  // dictionary decide which one is a real lemma.
  const suffixes = [
    ["ern",""],["en",""],["er",""],["es",""],["em",""],["e",""],["n",""],["s",""]
  ];
  for(const [suffix,repl] of suffixes){
    if(w.length > suffix.length + 2 && w.endsWith(suffix)){
      const stem = w.slice(0,-suffix.length)+repl;
      add(stem);
      for(const u of umlautBack(stem)) add(u);
    }
  }

  // German plural/declension patterns with a consonant + umlaut.
  for(const stem of [...out]){
    for(const u of umlautBack(stem)) add(u);
  }

  // Adjective degree/declension: schnellsten -> schnell, größeren -> groß etc.
  for(const suffix of ["sten","ste","ster","stes","stem","st","sten","ere","erer","eres","erem","eren"]){
    if(w.length > suffix.length + 2 && w.endsWith(suffix)){
      const stem = w.slice(0,-suffix.length);
      add(stem);
      for(const u of umlautBack(stem)) add(u);
    }
  }

  return uniqueStrings(out);
}

function lookupDirect(word){
  const key = normalizeWord(word);
  return learningDictionary.get(key) || localDictionary.get(key);
}

function buildWordInfo(selectedText, entry){
  const grammar = entry.grammar || "";
  let article = "—";
  if(/noun\s*,\s*male/i.test(grammar)) article = "der";
  else if(/noun\s*,\s*female/i.test(grammar)) article = "die";
  else if(/noun\s*,\s*neutral/i.test(grammar)) article = "das";

  return {
    word:selectedText,
    translation:entry.translation,
    base:entry.word,
    article,
    grammar
  };
}

function lookupWord(selectedText){
  const clean = normalizeWord(selectedText);

  if(!clean){
    return {word:selectedText,translation:"—",base:"—",article:"—",grammar:""};
  }

  // 1. Exact FreeDict match.
  const direct = lookupDirect(clean);
  if(direct) return buildWordInfo(selectedText, direct);

  // 2. Morphological candidates -> only accept candidates present in FreeDict.
  const candidates = morphologyCandidates(clean);
  for(const candidate of candidates){
    const entry = lookupDirect(candidate) || lookupDirect(preserveCase(clean,candidate));
    if(entry){
      return buildWordInfo(selectedText, entry);
    }
  }

  // 3. Final punctuation cleanup.
  const withoutPunctuation = clean.replace(/[.,!?;:…]+$/u, "").trim();
  if(withoutPunctuation && withoutPunctuation !== clean){
    const entry = lookupDirect(withoutPunctuation);
    if(entry) return buildWordInfo(selectedText, entry);
  }

  return {
    word:selectedText,
    translation:"Не найдено в словаре",
    base:"—",
    article:"—",
    grammar:""
  };
}

/* ---------- popup ---------- */

function getWordAtPoint(x, y){
  let range = null;

  if(document.caretRangeFromPoint){
    range = document.caretRangeFromPoint(x, y);
  }else if(document.caretPositionFromPoint){
    const position = document.caretPositionFromPoint(x, y);
    if(position){
      range = document.createRange();
      range.setStart(position.offsetNode, position.offset);
      range.collapse(true);
    }
  }

  if(!range || !editor.contains(range.startContainer)) return null;

  const node = range.startContainer;
  if(node.nodeType !== Node.TEXT_NODE) return null;

  const text = node.textContent || "";
  if(!text) return null;

  let offset = range.startOffset;
  if(offset >= text.length) offset = text.length - 1;
  if(offset < 0) return null;

  // Never treat whitespace/padding as a word.
  if(!/[\p{L}\p{N}ÄÖÜäöüß'’\-]/u.test(text[offset] || "")) return null;

  const isWordChar = ch => /[\p{L}\p{N}ÄÖÜäöüß'’\-]/u.test(ch);

  let start = offset;
  let end = offset + 1;

  while(start > 0 && isWordChar(text[start - 1])) start--;
  while(end < text.length && isWordChar(text[end])) end++;

  const word = text.slice(start, end);
  if(!word) return null;

  const wordRange = document.createRange();
  wordRange.setStart(node, start);
  wordRange.setEnd(node, end);

  // caretRangeFromPoint() may return the nearest caret even when the mouse
  // is actually in the gap between words/lines. Verify that the pointer is
  // physically inside the rendered word before returning it.
  const rects = Array.from(wordRange.getClientRects());
  const hit = rects.some(rect =>
    x >= rect.left && x <= rect.right &&
    y >= rect.top && y <= rect.bottom
  );
  if(!hit) return null;

  return {
    text: word,
    range: wordRange
  };
}

function positionPopup(){
  if(!currentSelection) return;

  const rect = currentSelection.range.getBoundingClientRect();
  const popupWidth = 330;
  const popupHeight = popup.offsetHeight || 260;

  let left = rect.left + rect.width / 2 - popupWidth / 2;

  left = Math.max(
    10,
    Math.min(left, window.innerWidth - popupWidth - 10)
  );

  let top = rect.top - popupHeight - 10;

  if(top < 10){
    top = rect.bottom + 10;
  }

  popup.style.left = left + "px";
  popup.style.top = top + "px";
}

function clearActiveWord(){
  document.querySelectorAll(".active-word").forEach(node => {
    const parent = node.parentNode;
    if(!parent) return;

    while(node.firstChild){
      parent.insertBefore(node.firstChild, node);
    }

    parent.removeChild(node);
    parent.normalize();
  });
}

function highlightWord(wordData){
  clearActiveWord();

  if(!wordData || !wordData.range) return;

  try{
    const range = wordData.range.cloneRange();
    const wrapper = document.createElement("span");
    wrapper.className = "active-word";
    wrapper.dataset.activeWord = "true";

    const contents = range.extractContents();
    wrapper.appendChild(contents);
    range.insertNode(wrapper);

    // Rebuild the range so the popup/actions still point to the highlighted word.
    const newRange = document.createRange();
    newRange.selectNodeContents(wrapper);

    currentSelection = {
      text: wrapper.textContent,
      range: newRange,
      activeElement: wrapper
    };
  }catch(error){
    console.error(error);
    currentSelection = wordData;
  }
}

function hideWordPopup(){
  popup.classList.remove("visible");
  currentSelection = null;
  pinnedPopup = false;
  clearActiveWord();
}

function showWordPopup(wordData, pin = false){
  if(!wordData) return;

  highlightWord(wordData);

  const info = lookupWord(currentSelection.text);

  document.getElementById("popupWord").textContent = wordData.text;

  document.getElementById("popupForm").textContent =
    info.grammar
      ? info.grammar
      : info.base !== "—"
        ? "Словарная форма: " + info.base
        : "Слово";

  document.getElementById("popupTranslation").textContent =
    info.translation;

  document.getElementById("popupBase").textContent =
    info.base;

  document.getElementById("popupArticle").textContent =
    info.article;

  document.getElementById("annotationInput").value =
    info.translation === "Не найдено в словаре"
      ? ""
      : info.translation;

  pinnedPopup = pin;
  popup.classList.add("visible");

  requestAnimationFrame(positionPopup);
}

function showHoverPopup(wordData){
  if(pinnedPopup || !wordData) return;
  const info = lookupWord(wordData.text);
  document.getElementById("popupWord").textContent = wordData.text;
  document.getElementById("popupForm").textContent =
    info.grammar ? info.grammar :
    info.base !== "—" ? "Словарная форма: " + info.base : "Слово";
  document.getElementById("popupTranslation").textContent = info.translation;
  document.getElementById("popupBase").textContent = info.base;
  document.getElementById("popupArticle").textContent = info.article;
  document.getElementById("annotationInput").value =
    info.translation === "Не найдено в словаре" ? "" : info.translation;

  // Hover is preview only: NEVER modify editor DOM or highlight the word.
  popup.classList.add("visible");
  const rect = wordData.range.getBoundingClientRect();
  const w = 330, h = popup.offsetHeight || 260;
  let left = rect.left + rect.width/2 - w/2;
  left = Math.max(10, Math.min(left, window.innerWidth-w-10));
  let top = rect.top-h-10;
  if(top < 10) top = rect.bottom+10;
  popup.style.left = left+"px";
  popup.style.top = top+"px";
}
/*
  WORD INTERACTION

  1. Hover over a real word -> preview popup only.
  2. Move away from the word -> preview disappears.
  3. Click a word -> popup is pinned and the word is highlighted.
  4. Click the same highlighted word again -> popup closes.
  5. Click another word -> popup switches to that word and stays pinned.
  6. Click anywhere outside the editor/popup -> popup closes.
*/
let hoverWordKey = null;

function makeWordKey(wordData){
  if(!wordData || !wordData.range) return null;
  const r = wordData.range;
  return [
    wordData.text,
    r.startContainer,
    r.startOffset,
    r.endContainer,
    r.endOffset
  ].join("|");
}

function closeHoverPreview(){
  if(pinnedPopup) return;
  popup.classList.remove("visible");
  hoverWordKey = null;
}

function openHoverPreview(wordData){
  if(pinnedPopup || !wordData) return;

  const key = makeWordKey(wordData);
  if(key === hoverWordKey && popup.classList.contains("visible")) return;

  hoverWordKey = key;
  showHoverPopup(wordData);
}

editor.addEventListener("mousemove", event => {
  if(pinnedPopup) return;

  const wordData = getWordAtPoint(event.clientX, event.clientY);

  if(wordData){
    openHoverPreview(wordData);
  }else{
    // No word under the pointer = no hover popup.
    closeHoverPreview();
  }
});

editor.addEventListener("mouseleave", () => {
  closeHoverPreview();
});

editor.addEventListener("click", event => {
  const wordData = getWordAtPoint(event.clientX, event.clientY);

  if(!wordData){
    hideWordPopup();
    hoverWordKey = null;
    return;
  }

  // Clicking the already highlighted word toggles the pinned popup off.
  if(
    pinnedPopup &&
    currentSelection &&
    currentSelection.activeElement &&
    currentSelection.activeElement.contains(event.target)
  ){
    hideWordPopup();
    hoverWordKey = null;
    return;
  }

  // A click on a word pins that exact word.
  showWordPopup(wordData, true);
  hoverWordKey = makeWordKey(wordData);
});

document.addEventListener("click", event => {
  if(popup.contains(event.target)) return;
  if(editor.contains(event.target)) return;

  hideWordPopup();
  hoverWordKey = null;
});

window.addEventListener("resize", positionPopup);

document.addEventListener("scroll", () => {
  if(popup.classList.contains("visible")){
    positionPopup();
  }
}, true);

/* ---------- saved dictionary ---------- */

function renderDictionary(){
  if(!savedWords.length){
    dictionaryList.innerHTML =
      '<div class="dictionary-empty">' +
      'Сохранённые слова появятся здесь.' +
      '</div>';
    return;
  }

  dictionaryList.innerHTML = savedWords.map((item, index) => `
    <div class="dictionary-item" data-index="${index}">
      <div>
        <div class="dictionary-word">${escapeHtml(item.word)}</div>
        <div class="dictionary-form">${escapeHtml(item.base || "")}</div>
      </div>
      <div class="dictionary-translation">${escapeHtml(item.translation || "")}</div>
      <button class="dictionary-delete" type="button" data-delete-index="${index}">Удалить</button>
    </div>
  `).join("");

  dictionaryList.querySelectorAll("[data-delete-index]").forEach(button => {
    button.addEventListener("click", event => {
      event.stopPropagation();
      removeFromLearningMemory(Number(button.dataset.deleteIndex));
    });
  });
}

function saveWordToDictionary(){
  if(!currentSelection) return;

  const selectedText = currentSelection.text;
  const info = lookupWord(selectedText);
  const manual = document.getElementById("annotationInput").value.trim();

  const translation = manual || (
    info.translation !== "Не найдено в словаре" ? info.translation : ""
  );

  if(!translation){
    statusEl.textContent = "Введите перевод для сохранения";
    return;
  }

  const item = {
    word: selectedText,
    base: info.base === "—" ? selectedText : info.base,
    article: info.article,
    grammar: info.grammar || "",
    translation
  };

  addToLearningMemory(item);
  injectLearningWordsIntoDictionary();
  refreshMissingWordMarks();
  updateWordCount();

  statusEl.textContent = "Слово сохранено в память";
}

document
  .getElementById("dictionaryBtn")
  .addEventListener("click", saveWordToDictionary);

/* ---------- annotation ---------- */

function addAnnotation(){
  if(!currentSelection) return;

  const note =
    document.getElementById("annotationInput").value.trim();

  if(!note){
    statusEl.textContent = "Введите перевод для пометки";
    return;
  }

  const range = currentSelection.range.cloneRange();

  try{
    const wrapper = document.createElement("span");
    wrapper.className = "annotation";

    const contents = range.extractContents();
    wrapper.appendChild(contents);

    const noteSpan = document.createElement("span");
    noteSpan.className = "annotation-note";
    noteSpan.textContent = "(" + note + ")";

    const fragment = document.createDocumentFragment();

    fragment.appendChild(wrapper);
    fragment.appendChild(noteSpan);

    range.insertNode(fragment);

    // Remove the temporary click highlight, if it exists.
    if(currentSelection && currentSelection.activeElement){
      const active = currentSelection.activeElement;
      const parent = active.parentNode;

      if(parent){
        while(active.firstChild){
          parent.insertBefore(active.firstChild, active);
        }
        parent.removeChild(active);
        parent.normalize();
      }
    }

    popup.classList.remove("visible");
    currentSelection = null;

    statusEl.textContent = "Пометка добавлена";

    updateWordCount();
  }catch(error){
    console.error(error);
    statusEl.textContent = "Не удалось добавить пометку";
  }
}

document
  .getElementById("annotateBtn")
  .addEventListener("click", addAnnotation);

/* ---------- learning memory file ---------- */

document.getElementById("memoryBtn").addEventListener("click", connectMemoryFile);

const memoryInput = document.getElementById("memoryInput");
memoryInput.addEventListener("change", async () => {
  const file = memoryInput.files[0];
  await importMemoryFile(file);
  memoryInput.value = "";
});

/* ---------- save/open ---------- */

function getDocumentData(){
  return {
    version:2,
    originalHtml:editor.innerHTML,
    savedWords,
    savedAt:new Date().toISOString()
  };
}

document.getElementById("saveBtn").addEventListener("click", () => {
  const data = JSON.stringify(
    getDocumentData(),
    null,
    2
  );

  const blob = new Blob(
    [data],
    {type:"application/json;charset=utf-8"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "german-language-document.json";
  a.click();

  URL.revokeObjectURL(url);

  statusEl.textContent = "Документ сохранён";
});

document.getElementById("openBtn").addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];

  if(!file) return;

  try{
    const text = await file.text();
    const data = JSON.parse(text);

    clearActiveWord();

    editor.innerHTML =
      data.originalHtml ||
      data.html ||
      "";

    const documentWords =
      Array.isArray(data.savedWords)
        ? data.savedWords
        : Array.isArray(data.words)
          ? data.words
          : [];

    mergeDocumentWords(documentWords);
    injectLearningWordsIntoDictionary();
    renderDictionary();
    updateWordCount();
    refreshMissingWordMarks();
    updateWordCount();

    statusEl.textContent = "Документ открыт";
  }catch(error){
    console.error(error);
    statusEl.textContent = "Ошибка открытия файла";
  }

  fileInput.value = "";
});

document.getElementById("newBtn").addEventListener("click", () => {
  clearActiveWord();
  editor.innerHTML = "";
  currentSelection = null;

  popup.classList.remove("visible");

  renderDictionary();
  updateWordCount();

  statusEl.textContent = "Новый документ";
});

document
  .getElementById("dictionaryToggle")
  .addEventListener("change", event => {
    workspace.classList.toggle(
      "single",
      !event.target.checked
    );
  });

/* ---------- helpers ---------- */

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getTextWords(){
  const text = editor.innerText || "";
  return text.match(/[\p{L}\p{N}ÄÖÜäöüßẞ]+(?:[-'][\p{L}\p{N}ÄÖÜäöüßẞ]+)*/gu) || [];
}

function isFoundWord(word){
  const info = lookupWord(word);
  return info.base !== "—" && info.translation !== "Не найдено в словаре";
}

function pointInsideRects(rects, x, y){
  for(const r of rects){
    if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true;
  }
  return false;
}

function getEditorTextNodes(){
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      const parent = node.parentElement;
      if(!parent) return NodeFilter.FILTER_REJECT;
      if(parent.closest(".annotation-note, .dictionary-ui")) return NodeFilter.FILTER_REJECT;
      return node.nodeValue ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes=[];
  let node;
  while((node=walker.nextNode())) nodes.push(node);
  return nodes;
}

function unwrapMissingWords(){
  editor.querySelectorAll("span.missing-word").forEach(span => {
    const parent = span.parentNode;
    if(!parent) return;
    while(span.firstChild) parent.insertBefore(span.firstChild, span);
    parent.removeChild(span);
  });
  editor.normalize();
}

function refreshMissingWordMarks(){
  if(!editor.innerText.trim()) return;
  unwrapMissingWords();

  const nodes = getEditorTextNodes();
  for(const node of nodes){
    const text = node.nodeValue;
    const regex = /[\p{L}\p{N}ÄÖÜäöüßẞ]+(?:[-'][\p{L}\p{N}ÄÖÜäöüßẞ]+)*/gu;
    const matches = [...text.matchAll(regex)];
    if(!matches.length) continue;

    const frag = document.createDocumentFragment();
    let cursor = 0;
    let changed = false;

    for(const match of matches){
      const word = match[0];
      const start = match.index;
      if(start > cursor) frag.appendChild(document.createTextNode(text.slice(cursor, start)));

      if(isFoundWord(word)){
        frag.appendChild(document.createTextNode(word));
      }else{
        const mark = document.createElement("span");
        mark.className = "missing-word";
        mark.textContent = word;
        frag.appendChild(mark);
        changed = true;
      }
      cursor = start + word.length;
    }

    if(cursor < text.length) frag.appendChild(document.createTextNode(text.slice(cursor)));

    if(changed){
      node.parentNode.replaceChild(frag, node);
    }
  }
}

function updateWordCount(){
  const words = getTextWords();
  const total = words.length;
  let found = 0;

  for(const word of words){
    if(isFoundWord(word)) found++;
  }

  const notFound = total - found;

  wordCountEl.textContent = total + " " + (total === 1 ? "слово" : "слов");
  editorStatsEl.textContent =
    "Оригинал · " + total +
    " слов · найдено: " + found +
    " · не найдено: " + notFound;
}

editor.addEventListener("input", () => {
  setTimeout(() => {
    updateWordCount();
    refreshMissingWordMarks();
    updateWordCount();
  }, 0);
});

/* ---------- start ---------- */

loadLearningMemory();
loadMemoryHandle();
updateWordCount();
loadLocalDictionary().then(() => {
  injectLearningWordsIntoDictionary();
  updateWordCount();
  refreshMissingWordMarks();
  updateWordCount();
});
