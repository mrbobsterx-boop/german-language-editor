<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>German Language Editor</title>
<style>
:root{
  --bg:#242424;--panel:#292929;--line:#474747;--text:#d7d7d7;
  --muted:#9d9d9d;--heading:#b9c9d8;--accent2:#6f96b4;
  --popup:#202020;--green:#8db69b;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:64px;padding:0 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#222}
.brand{font-size:19px;font-weight:700;color:var(--heading)}
.toolbar{display:flex;gap:8px;align-items:center}
.btn{border:1px solid #505050;background:#303030;color:#d5d5d5;border-radius:6px;padding:8px 12px}
.btn:hover{background:#3a3a3a;border-color:#666}
.btn.primary{background:#3c566b;border-color:#55748d;color:#eef6fb}
.toggle{display:flex;align-items:center;gap:7px;margin-left:8px;color:#bbb;font-size:13px;user-select:none}
.workspace{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.workspace.single{grid-template-columns:1fr}
.column{min-width:0;display:flex;flex-direction:column}
.column+.column{border-left:1px solid var(--line)}
.column-header{height:48px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);color:var(--heading);font-weight:700;background:#272727}
.column-header small{color:var(--muted);font-weight:400;font-size:12px}
.editor-wrap{position:relative;flex:1;overflow:auto}
.editor{width:100%;min-height:100%;padding:28px 32px 120px;outline:none;white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:1.72;color:#d9d9d9}
.editor:empty:before{content:attr(data-placeholder);color:#777}
.dictionary-list{padding:18px 22px 90px;overflow:auto;min-height:100%}
.dictionary-empty{color:#777;font-size:14px;line-height:1.6;padding:12px 2px}
.dictionary-item{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:13px 2px;border-bottom:1px solid #2b2b2b}
.dictionary-word{color:#e6e6e6;font-size:16px;font-weight:600;line-height:1.35}
.dictionary-form{color:#808080;font-size:12px;margin-top:4px}
.dictionary-translation{color:#c9c9c9;font-size:15px;line-height:1.4;text-align:right;max-width:52%}
.dictionary-status{padding:8px 22px;color:#888;font-size:11px;border-bottom:1px solid #2b2b2b}
.annotation{display:inline;background:rgba(143,179,207,.13);border-bottom:1px solid #6f96b4;border-radius:2px;padding:1px 2px}
.annotation-note{color:#9eb9cc;font-size:.78em;margin-left:3px;opacity:.95}
.selection-popup{position:fixed;z-index:1000;width:330px;background:var(--popup);border:1px solid #555;border-radius:8px;box-shadow:0 15px 45px rgba(0,0,0,.45);padding:14px;display:none}
.selection-popup.visible{display:block}
.popup-word{font-size:19px;font-weight:700;color:#e1e8ed;margin-bottom:3px}
.popup-form{color:#91adc1;font-size:14px;margin-bottom:10px}
.popup-row{display:grid;grid-template-columns:92px 1fr;gap:8px;margin:5px 0;font-size:14px}
.popup-label{color:#858585}.popup-value{color:#ddd}
.popup-actions{display:flex;gap:7px;margin-top:13px}
.popup-actions .btn{flex:1;font-size:12px;padding:7px 8px}
.popup-input{width:100%;margin-top:10px;background:#2c2c2c;color:#ddd;border:1px solid #4c4c4c;border-radius:5px;padding:8px 9px;outline:none}
.popup-input:focus{border-color:var(--accent2)}
.statusbar{height:34px;border-top:1px solid var(--line);padding:0 16px;display:flex;align-items:center;justify-content:space-between;color:#858585;font-size:12px;background:#222}
.statusbar .saved{color:var(--green)}
#fileInput{display:none}
@media(max-width:800px){
  .workspace{grid-template-columns:1fr}.translation-column{display:none}
  .topbar{padding:0 12px}.editor{padding:22px 18px 100px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">German Language Editor</div>
  <div class="toolbar">
    <button class="btn" id="newBtn">Новый</button>
    <button class="btn" id="openBtn">Открыть</button>
    <button class="btn primary" id="saveBtn">Сохранить</button>
    <label class="toggle">
      <input type="checkbox" id="dictionaryToggle" checked>
      Слова для обучения
    </label>
  </div>
</header>

<main class="workspace" id="workspace">
<section class="column">
  <div class="column-header"><span>Deutsch</span><small>Оригинал</small></div>
  <div class="editor-wrap">
    <div id="editor" class="editor" contenteditable="true" spellcheck="false"
         data-placeholder="Вставь сюда немецкий текст..."></div>
  </div>
</section>

<section class="column translation-column" id="translationColumn">
  <div class="column-header"><span>Слова</span><small>Для обучения</small></div>
  <div id="dictionaryStatus" class="dictionary-status">Загрузка словаря...</div>
  <div id="dictionaryList" class="dictionary-list">
    <div class="dictionary-empty">Сохранённые слова появятся здесь.</div>
  </div>
</section>
</main>

<footer class="statusbar">
  <span id="status">Загрузка словаря...</span>
  <span id="wordCount">0 слов</span>
</footer>
</div>

<input type="file" id="fileInput" accept=".json,.txt">

<div class="selection-popup" id="popup">
  <div class="popup-word" id="popupWord">Wort</div>
  <div class="popup-form" id="popupForm">—</div>

  <div class="popup-row">
    <div class="popup-label">Перевод</div>
    <div class="popup-value" id="popupTranslation">—</div>
  </div>

  <div class="popup-row">
    <div class="popup-label">Базовая форма</div>
    <div class="popup-value" id="popupBase">—</div>
  </div>

  <div class="popup-row">
    <div class="popup-label">Артикль</div>
    <div class="popup-value" id="popupArticle">—</div>
  </div>

  <input id="annotationInput" class="popup-input"
         placeholder="Перевод для пометки в тексте...">

  <div class="popup-actions">
    <button class="btn" id="annotateBtn">Добавить в текст</button>
    <button class="btn primary" id="dictionaryBtn">Сохранить в словарь</button>
  </div>
</div>

<script>
/*
  German Language Editor
  ======================
  Dictionary source:
      data/de-ru-freedict.json

  Expected JSON:
  [
    {"word":"machen","translation":["делать"],"grammar":"verb"},
    ...
  ]

  Also accepts an object with a "words" array.
*/

/* ---------- state ---------- */

const editor = document.getElementById("editor");
const popup = document.getElementById("popup");
const dictionaryList = document.getElementById("dictionaryList");
const dictionaryStatus = document.getElementById("dictionaryStatus");
const statusEl = document.getElementById("status");
const wordCountEl = document.getElementById("wordCount");
const workspace = document.getElementById("workspace");
const fileInput = document.getElementById("fileInput");

let localDictionary = new Map();
let savedWords = [];
let currentSelection = null;
let selectionJustFinished = false;

/* ---------- dictionary ---------- */

function normalizeWord(value){
  return String(value || "")
    .trim()
    .toLocaleLowerCase("de-DE")
    .replace(/^[„“"«»'‘’([{]+/u, "")
    .replace(/[.,!?;:…„“"«»)\]}]+$/u, "");
}

function normalizeTranslation(value){
  if(Array.isArray(value)) return value.filter(Boolean).join("; ");
  return String(value || "").trim();
}

function addDictionaryEntry(entry){
  if(!entry || typeof entry !== "object") return;

  const word = String(
    entry.word ??
    entry.headword ??
    entry.de ??
    entry.german ??
    ""
  ).trim();

  const translation = normalizeTranslation(
    entry.translation ??
    entry.translations ??
    entry.ru ??
    entry.russian ??
    ""
  );

  if(!word || !translation) return;

  const key = normalizeWord(word);
  if(!key) return;

  if(!localDictionary.has(key)){
    localDictionary.set(key, {
      word,
      translation,
      grammar: String(entry.grammar ?? entry.pos ?? "").trim()
    });
  }
}

async function loadLocalDictionary(){
  try{
    const response = await fetch("data/de-ru-freedict.json", {
      cache: "no-store"
    });

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if(Array.isArray(data)){
      for(const entry of data) addDictionaryEntry(entry);
    }else if(data && Array.isArray(data.words)){
      for(const entry of data.words) addDictionaryEntry(entry);
    }else if(data && Array.isArray(data.entries)){
      /*
        This is the actual format of our converted FreeDict file:
        {
          "source": "...",
          "version": "...",
          "wordcount": 26809,
          "entries": [
            {
              "word": "machen",
              "translation": ["делать"],
              "grammar": "verb"
            }
          ]
        }
      */
      for(const entry of data.entries) addDictionaryEntry(entry);
    }else if(data && typeof data === "object"){
      /*
        Supports a compact object dictionary too.
      */
      for(const [word, value] of Object.entries(data)){
        if(["source","version","wordcount","entries","words"].includes(word)) continue;

        if(value && typeof value === "object" && !Array.isArray(value)){
          addDictionaryEntry({word, ...value});
        }else{
          addDictionaryEntry({word, translation:value});
        }
      }
    }

    dictionaryStatus.textContent =
      "FreeDict DE→RU: " +
      localDictionary.size.toLocaleString("ru-RU") +
      " записей";

    statusEl.textContent = "Словарь загружен";
  }catch(error){
    console.error(error);

    dictionaryStatus.textContent =
      "Не удалось загрузить data/de-ru-freedict.json";

    statusEl.textContent = "Ошибка загрузки словаря";
  }
}

function lookupWord(selectedText){
  const clean = normalizeWord(selectedText);

  if(!clean){
    return {
      word:selectedText,
      translation:"—",
      base:"—",
      article:"—",
      grammar:""
    };
  }

  const direct = localDictionary.get(clean);

  if(direct){
    return {
      word:selectedText,
      translation:direct.translation,
      base:direct.word,
      article:"—",
      grammar:direct.grammar
    };
  }

  /*
    Small normalization for German compounds/forms:
    try the selected text with a trailing punctuation removed.
  */
  const withoutPunctuation = clean
    .replace(/[.,!?;:…]+$/u, "")
    .trim();

  if(withoutPunctuation && withoutPunctuation !== clean){
    const normalized = localDictionary.get(withoutPunctuation);

    if(normalized){
      return {
        word:selectedText,
        translation:normalized.translation,
        base:normalized.word,
        article:"—",
        grammar:normalized.grammar
      };
    }
  }

  return {
    word:selectedText,
    translation:"Нет точного совпадения в FreeDict",
    base:"—",
    article:"—",
    grammar:""
  };
}

/* ---------- popup ---------- */

function getWordAtPoint(x, y){
  let range = null;

  if(document.caretRangeFromPoint){
    range = document.caretRangeFromPoint(x, y);
  }else if(document.caretPositionFromPoint){
    const position = document.caretPositionFromPoint(x, y);
    if(position){
      range = document.createRange();
      range.setStart(position.offsetNode, position.offset);
      range.collapse(true);
    }
  }

  if(!range || !editor.contains(range.startContainer)) return null;

  let node = range.startContainer;

  if(node.nodeType !== Node.TEXT_NODE){
    return null;
  }

  const text = node.textContent || "";
  let offset = range.startOffset;

  if(offset === text.length && offset > 0) offset--;

  // If the click is exactly on whitespace, don't open the popup.
  if(/\s/u.test(text[offset] || "")) return null;

  let start = offset;
  let end = offset + 1;

  // Word characters: letters, numbers, German umlauts, ß, apostrophe/hyphen.
  const isWordChar = ch => /[\p{L}\p{N}ÄÖÜäöüß'’\-]/u.test(ch);

  while(start > 0 && isWordChar(text[start - 1])) start--;
  while(end < text.length && isWordChar(text[end])) end++;

  const word = text.slice(start, end).trim();

  if(!word) return null;

  const wordRange = document.createRange();
  wordRange.setStart(node, start);
  wordRange.setEnd(node, end);

  return {
    text: word,
    range: wordRange
  };
}

function positionPopup(){
  if(!currentSelection) return;

  const rect = currentSelection.range.getBoundingClientRect();
  const popupWidth = 330;
  const popupHeight = popup.offsetHeight || 260;

  let left = rect.left + rect.width / 2 - popupWidth / 2;

  left = Math.max(
    10,
    Math.min(left, window.innerWidth - popupWidth - 10)
  );

  let top = rect.top - popupHeight - 10;

  if(top < 10){
    top = rect.bottom + 10;
  }

  popup.style.left = left + "px";
  popup.style.top = top + "px";
}

function showWordPopup(wordData){
  if(!wordData) return;

  currentSelection = wordData;

  const info = lookupWord(wordData.text);

  document.getElementById("popupWord").textContent = wordData.text;

  document.getElementById("popupForm").textContent =
    info.grammar
      ? info.grammar
      : info.base !== "—"
        ? "Словарная форма: " + info.base
        : "Слово";

  document.getElementById("popupTranslation").textContent =
    info.translation;

  document.getElementById("popupBase").textContent =
    info.base;

  document.getElementById("popupArticle").textContent =
    info.article;

  document.getElementById("annotationInput").value =
    info.translation.startsWith("Нет точного")
      ? ""
      : info.translation;

  popup.classList.add("visible");

  requestAnimationFrame(positionPopup);
}

/*
  WORD CLICK MODE
  ---------------
  There is no text selection anymore.

  A normal left click inside the German editor finds the word
  under the mouse and opens its popup.
*/
editor.addEventListener("click", event => {
  // Clicking an existing annotation should still resolve to the word.
  const wordData = getWordAtPoint(event.clientX, event.clientY);

  if(!wordData){
    popup.classList.remove("visible");
    currentSelection = null;
    return;
  }

  showWordPopup(wordData);
});

document.addEventListener("click", event => {
  if(popup.contains(event.target)) return;
  if(editor.contains(event.target)) return;

  popup.classList.remove("visible");
  currentSelection = null;
});

window.addEventListener("resize", positionPopup);

document.addEventListener("scroll", () => {
  if(popup.classList.contains("visible")){
    positionPopup();
  }
}, true);

/* ---------- saved dictionary ---------- */

function renderDictionary(){
  if(!savedWords.length){
    dictionaryList.innerHTML =
      '<div class="dictionary-empty">' +
      'Сохранённые слова появятся здесь.' +
      '</div>';
    return;
  }

  dictionaryList.innerHTML = savedWords.map((item, index) => `
    <div class="dictionary-item" data-index="${index}">
      <div>
        <div class="dictionary-word">
          ${escapeHtml(item.word)}
        </div>
        <div class="dictionary-form">
          ${escapeHtml(item.base || "")}
        </div>
      </div>
      <div class="dictionary-translation">
        ${escapeHtml(item.translation || "")}
      </div>
    </div>
  `).join("");
}

function saveWordToDictionary(){
  if(!currentSelection) return;

  const selectedText = currentSelection.text;
  const info = lookupWord(selectedText);

  const manual =
    document.getElementById("annotationInput").value.trim();

  const translation =
    manual ||
    (
      info.translation.startsWith("Нет точного")
        ? ""
        : info.translation
    );

  if(!translation){
    statusEl.textContent = "Нет перевода для сохранения";
    return;
  }

  const exists = savedWords.some(
    item =>
      normalizeWord(item.word) === normalizeWord(selectedText)
  );

  if(!exists){
    savedWords.push({
      word:selectedText,
      base:info.base === "—" ? selectedText : info.base,
      article:info.article,
      translation
    });

    renderDictionary();
  }

  statusEl.textContent = "Слово сохранено";
}

document
  .getElementById("dictionaryBtn")
  .addEventListener("click", saveWordToDictionary);

/* ---------- annotation ---------- */

function addAnnotation(){
  if(!currentSelection) return;

  const note =
    document.getElementById("annotationInput").value.trim();

  if(!note){
    statusEl.textContent = "Введите перевод для пометки";
    return;
  }

  const range = currentSelection.range.cloneRange();

  try{
    const wrapper = document.createElement("span");
    wrapper.className = "annotation";

    const contents = range.extractContents();
    wrapper.appendChild(contents);

    const noteSpan = document.createElement("span");
    noteSpan.className = "annotation-note";
    noteSpan.textContent = "(" + note + ")";

    const fragment = document.createDocumentFragment();

    fragment.appendChild(wrapper);
    fragment.appendChild(noteSpan);

    range.insertNode(fragment);

    popup.classList.remove("visible");
    currentSelection = null;

    statusEl.textContent = "Пометка добавлена";

    updateWordCount();
  }catch(error){
    console.error(error);
    statusEl.textContent = "Не удалось добавить пометку";
  }
}

document
  .getElementById("annotateBtn")
  .addEventListener("click", addAnnotation);

/* ---------- save/open ---------- */

function getDocumentData(){
  return {
    version:2,
    originalHtml:editor.innerHTML,
    savedWords,
    savedAt:new Date().toISOString()
  };
}

document.getElementById("saveBtn").addEventListener("click", () => {
  const data = JSON.stringify(
    getDocumentData(),
    null,
    2
  );

  const blob = new Blob(
    [data],
    {type:"application/json;charset=utf-8"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "german-language-document.json";
  a.click();

  URL.revokeObjectURL(url);

  statusEl.textContent = "Документ сохранён";
});

document.getElementById("openBtn").addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];

  if(!file) return;

  try{
    const text = await file.text();
    const data = JSON.parse(text);

    editor.innerHTML =
      data.originalHtml ||
      data.html ||
      "";

    savedWords =
      Array.isArray(data.savedWords)
        ? data.savedWords
        : Array.isArray(data.words)
          ? data.words
          : [];

    renderDictionary();
    updateWordCount();

    statusEl.textContent = "Документ открыт";
  }catch(error){
    console.error(error);
    statusEl.textContent = "Ошибка открытия файла";
  }

  fileInput.value = "";
});

document.getElementById("newBtn").addEventListener("click", () => {
  editor.innerHTML = "";
  savedWords = [];
  currentSelection = null;

  popup.classList.remove("visible");

  renderDictionary();
  updateWordCount();

  statusEl.textContent = "Новый документ";
});

document
  .getElementById("dictionaryToggle")
  .addEventListener("change", event => {
    workspace.classList.toggle(
      "single",
      !event.target.checked
    );
  });

/* ---------- helpers ---------- */

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function updateWordCount(){
  const text = editor.innerText || "";
  const words = text.trim()
    ? text.trim().split(/\s+/).length
    : 0;

  wordCountEl.textContent =
    words + " " +
    (words === 1 ? "слово" : "слов");
}

editor.addEventListener("input", updateWordCount);

/* ---------- start ---------- */

renderDictionary();
updateWordCount();
loadLocalDictionary();
</script>
</body>
</html>
